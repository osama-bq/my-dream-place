<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- fonts -->
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet">
                
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/auth-styles.css">
    <title>Create Password</title>
</head>
<body>
<!-- Header -->
<nav class="navbar">
    <div class="nav-content container">
        <a href="../index.html" class="brand">
            <img src="../res/icon/plane-logo.png" alt="">
            <h3 class="brand-name">my Dream Place</h3>
        </a>
    </div>
</nav>
<!-- Header -->

<!-- Form -->
<form action="sign-in.html">
    <div class="auth-form">
        <h2 class="auth-title create-pass-title">Create password</h2>
        <p class="auth-subtitle create-pass-guide">
            Use a minimum of 10 characters, including letters, lowercase letters, and numbers.
        </p>
        <div class="input-group create-pass">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>
        <div class="input-group confirm-pass">
            <label>Confirm Password</label>
            <input type="password" name="confirmPassword" required>
        </div>
        <input class="btn btn-auth btn-create-pass" type="submit" value="Create Account">
        <div class="terms-and-cons">
            By creating an account, you agree with our <a href="#">Terms and Conditions</a> and <a href="#">Privacy Statement.</a>
        </div>
    </div>
</form>
<!-- Form -->

</body>
</html>
