<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- fonts -->
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet">
                
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/auth-styles.css">
    <title>Register</title>
</head>
<body>
<!-- Header -->
<nav class="navbar">
    <div class="nav-content container">
        <a href="../index.html" class="brand">
            <img src="../res/icon/plane-logo.png" alt="">
            <h3 class="brand-name">my Dream Place</h3>
        </a>
    </div>
</nav>
<!-- Header -->

<!-- Form -->
<form action="create-password.html">
    <div class="auth-form">
        <h2 class="auth-title register-title">Register</h2>
        <div class="input-group register-email">
            <label>Email address</label>
            <input type="email" name="email" required>
        </div>
        <input class="btn btn-auth sign-in-btn" type="submit" value="Continue with email">
        <div class="divider">
            <span>or use one of these options</span>
        </div>
        <button class="btn btn-auth btn-google">
            <img src="../res/icon/google.png" alt="">
            Continue with Google
        </button>
        <button class="btn btn-auth btn-fb">
            <img src="../res/icon/facebook.png" alt="">
            Continue with Facebook
        </button>
        <div class="switch-page">
            Already have an account? <a href="sign-in.html">Sign in</a>
        </div>
    </div>
</form>
<!-- Form -->

</body>
</html>
