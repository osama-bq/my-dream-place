<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- fonts -->
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet">
                
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/auth-styles.css">
    <title>Create Password</title>
</head>
<body>
<!-- Header -->
<nav class="navbar">
    <div class="nav-content container">
        <div class="brand">
            <img src="../res/icon/plane-logo.png" alt="">
            <h3 class="brand-name">my Dream Place</h3>
        </div>
    </div>
</nav>
<!-- Header -->

<!-- Form -->
<form action="check-inbox.html">
    <div class="auth-form">
        <h2 class="auth-title forgot-pass-title">Forgot your password?</h2>
        <p class="auth-subtitle forgot-pass-guide">
            We’ll send you a link to reset it. Enter your email address used for My Dream Place
        </p>
        <div class="input-group forgot-pass-email">
            <label>Your email address</label>
            <input type="email">
        </div>
        <input class="btn btn-auth btn-send-link" type="submit" value="Send Reset Link">
        <div class="terms-and-cons">
            By creating an account, you agree with our <a href="#">Terms and Conditions</a> and <a href="#">Privacy Statement.</a>
        </div>
    </div>
</form>
<!-- Form -->

</body>
</html>
