<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- fonts -->
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet">
                
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/auth-styles.css">
    <title>Sign In</title>
</head>
<body>
<!-- Header -->
<nav class="navbar">
    <div class="nav-content container">
        <div class="brand">
            <img src="../res/icon/plane-logo.png" alt="">
            <h3 class="brand-name">my Dream Place</h3>
        </div>
    </div>
</nav>
<!-- Header -->

<!-- Form -->
<form action="../index.html">
    <div class="auth-form">
        <h2 class="auth-title sign-in-title">Sign in</h2>
        <div class="input-group sign-in-email">
            <label>Email address</label>
            <input type="email" name="email" required>
        </div>
        <div class="input-group sign-in-pass">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>
        <div class="d-flex justify-content-between keep-me-row">
            <div class="keep-me">
                <input id="keep-me" type="checkbox" name="keepMeSignedIn">
                <label for="keep-me">Keep me signed in</label>
            </div>
            <a class="forgot-pass" href="forgot-password.html">Forgot password?</a>
        </div>
        <input class="btn btn-auth sign-in-btn" type="submit" value="Continue with email">
        <div class="divider">
            <span>or use one of these options</span>
        </div>
        <button class="btn btn-auth btn-google" type="submit">
            <img src="../res/icon/google.png" alt="">
            Continue with Google
        </button>
        <button class="btn btn-auth btn-fb" type="submit">
            <img src="../res/icon/facebook.png" alt="">
            Continue with Facebook
        </button>
        <div class="switch-page">
            Don't have an account? <a href="register.html">Register</a>
        </div>
    </div>
</form>
<!-- Form -->

</body>
</html>
